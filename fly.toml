# הגדרות פריסה ל-Fly.io
# שנה את שם האפליקציה (app) לשם ייחודי משלך לפני הפריסה, או הרץ "fly launch"
# שיצור אותו עבורך. שם זה יופיע גם בכתובת: https://<app>.fly.dev

app = "yetziot-mahlaka-1"
primary_region = "fra"  # פרנקפורט - קרוב יחסית לישראל. אפשר לשנות (למשל "cdg" פריז)

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DB_PATH = "/data/data.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# כונן קבוע לשמירת בסיס הנתונים (SQLite) - כך הנתונים נשמרים בין פריסות והפעלות
[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
